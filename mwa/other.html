<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile WA fixture 2</title>
  <style>
    body { font-family: Arial, sans-serif; color: #111; background: #fff; margin: 16px; }
    /* Full-width link pinned to the bottom of the viewport, so a device tap at the same screen
       height reaches it on any phone; the body padding keeps it from covering page content. */
    body { padding-bottom: 30vh; }
    .next-page { position: fixed; left: 0; right: 0; bottom: 0; height: 22vh; display: flex; align-items: center; justify-content: center; background: #0b57d0; color: #fff; font-size: 22px; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <header><h1>Mobile WA fixture 2</h1></header>
  <main>
    <button id="cta" type="button"></button>
    <a id="next-page" class="next-page" href="basic.html">Back to fixture 1</a>
  </main>
  <!-- Live pages keep changing after load, and the Mobile WA agent scans a page reached by a link on
       its first DOM change once it is attached (2-35s after load in regression). When this page is
       reached by a link, it toggles a class on <main> (no visual or a11y effect) every 2s for 2
       minutes. Opened directly (as a scan's start page), it stays still. -->
  <script>
    (function () {
      if (!document.referrer) return;
      var main = document.querySelector('main');
      var ticks = 0;
      var timer = setInterval(function () {
        main.classList.toggle('tick');
        ticks += 1;
        if (ticks >= 60) clearInterval(timer);
      }, 2000);
    })();
  </script>
</body>
</html>
